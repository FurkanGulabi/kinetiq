name: Bug report
description: Something in Kinetiq does not work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For anything that could let someone else move a machine or run code, do not file it here: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: unexpected-motion
    attributes:
      label: Did the machine move in a way you did not command?
      options:
        - "No"
        - "Yes"
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Controller and firmware
      description: The connection hint in the top bar shows it, or send `$I` in the console.
      placeholder: ESP32, FluidNC v4.0.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system, Node.js version and browser
      placeholder: Windows 11, Node 22, Chrome
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Kinetiq version
      description: Output of `git rev-parse --short HEAD`.
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Seen on
      options:
        - Real machine
        - Fake controller
        - Both
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log
      description: The terminal output of Kinetiq around the problem, and the console widget lines if they are relevant. Remove anything private first.
      render: text
